<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyse IA Immobilier</title>
    <style>
        body {
            background: #243b55;
            color: white;
            font-family: Segoe UI, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            background: #e91e63;
            padding: 10px;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #result {
            background: white;
            color: #111;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔍 Analyse d'une annonce par l'IA</h1>

    <label>📎 Lien ou texte de l'annonce :</label>
    <textarea id="annonce" rows="2"></textarea>

    <label>🛠️ Code HTML (optionnel) :</label>
    <textarea id="htmlFallback" rows="6"></textarea>

    <div style="margin:15px 0;">
        <button id="analyser" style="background:#e91e63;color:white;">🤖 Lancer l’analyse IA</button>
        <button id="clear" style="background:#1a2a4f;color:white;">🧹 Effacer</button>
    </div>

    <div id="result">🧠 Le rapport s'affichera ici...</div>

    <script>
        const API_KEY = window._env_.REACT_APP_OPENAI_API_KEY; // ⚡ injecté par Vercel/.env

        document.getElementById("analyser").addEventListener("click", async () => {
            const annonce = document.getElementById("annonce").value;
            const htmlFallback = document.getElementById("htmlFallback").value;
            let resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "⏳ Analyse en cours...";

            try {
                let texte = annonce;
                if (htmlFallback) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlFallback, "text/html");
                    doc.querySelectorAll("script,style,noscript").forEach(el => el.remove());
                    texte = doc.body.innerText.replace(/\s+/g, " ").trim();
                }

               const prompt = `
Tu es un expert immobilier senior (transaction, estimation, analyse de marché).
Tu travailles comme un professionnel de l’immobilier (agence, notaire, investisseur).

OBJECTIF :
Produire une SYNTHÈSE IMMOBILIÈRE COMPLÈTE, DÉTAILLÉE ET EXPLOITABLE
à partir de l’annonce brute fournie.

⚠️ RÈGLES IMPÉRATIVES :
- Tu dois analyser TOUTES les informations présentes dans l’annonce
- Tu n’inventes AUCUNE donnée
- Si une information est absente → indiquer clairement "Non précisé"
- Ne pas faire une synthèse courte ou vague
- Ton professionnel, clair, structuré, crédible (pas marketing bidon)

━━━━━━━━━━━━━━━━━━━━━━
📌 STRUCTURE OBLIGATOIRE
━━━━━━━━━━━━━━━━━━━━━━

1️⃣ FICHE TECHNIQUE DU BIEN  
(extraire et lister exhaustivement les éléments trouvés dans l’annonce)

- Type de bien  
- Localisation  
- Surface habitable  
- Nombre de pièces  
- Nombre de chambres  
- Surface du terrain (si précisée)  
- Étage / plain-pied  
- Année de construction (si indiquée)  
- État général  
- Chauffage (type + énergie)  
- DPE / GES (si présents)  
- Isolation (si mentionnée)  
- Stationnement  
- Dépendances / annexes  
- Équipements et prestations  
- Autres informations notables  

2️⃣ DONNÉES FINANCIÈRES

- Prix affiché  
- Prix au m² (calculé si possible)  
- Positionnement du prix :
  (sous-évalué / cohérent / au-dessus du marché)
- Justification basée sur les caractéristiques du bien

3️⃣ POINTS FORTS DU BIEN  
(liste factuelle basée uniquement sur l’annonce)

4️⃣ POINTS DE VIGILANCE  
(travaux, DPE faible, contraintes, éléments à anticiper)

5️⃣ ANALYSE DE MARCHÉ

- Analyse professionnelle du positionnement du bien  
- Rapport qualité / prix  
- Attractivité sur le marché local  

6️⃣ PROFIL D’ACHETEUR IDÉAL

- Typologie d’acheteur la plus pertinente  
- Pourquoi ce bien correspond à ce profil  

7️⃣ RÉSUMÉ COMMERCIAL FINAL

- Texte fluide et professionnel  
- Prêt à être utilisé dans une annonce d’agence  
- Ton sérieux, rassurant et crédible  

━━━━━━━━━━━━━━━━━━━━━━
📄 ANNONCE BRUTE
━━━━━━━━━━━━━━━━━━━━━━

${texte}
`;



               const response = await fetch("https://api.openai.com/v1/chat/completions", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${API_KEY}`
  },
  body: JSON.stringify({
    model: "gpt-4o",
    messages: [{ role: "user", content: prompt }],
    temperature: 0.35
  })
});


  const data = await response.json();

  if (!response.ok || data.error) {
    resultDiv.innerHTML = "❌ Erreur API : " + (data?.error?.message || "Erreur inconnue");
    return;
  }

  const texteIA = data.choices?.[0]?.message?.content || "⚠️ Aucun résultat généré.";

  resultDiv.innerHTML = `
    <h2 style="color:#ffd700;">📊 Synthèse de l'annonce</h2>
    <div style="
      background:#1f2f4d;
      color:white;
      padding:20px;
      border-radius:12px;
      line-height:1.6;
      white-space:pre-wrap;
    ">
      ${texteIA}
    </div>
  `;

} catch (err) {
  resultDiv.innerHTML = "❌ Erreur technique : " + err.message;
}
        });

        document.getElementById("clear").addEventListener("click", () => {
          document.getElementById("annonce").value = "";
          document.getElementById("htmlFallback").value = "";
          document.getElementById("result").innerHTML = "🧠 Le rapport s'affichera ici...";
        });
    </script>
</body>
</html>
